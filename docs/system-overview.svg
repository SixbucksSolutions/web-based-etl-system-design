<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="1615" viewBox="0 0 1290 1615" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Web service system overview</title>
  <desc id="diagram-description">External Data Source 1 and External Data Source N each connect to their own resilient reader fleet through REST polling, WebSocket push, or other supported transfer methods. The Managed Secrets Store holds credentials and connection configuration in the lower Management Plane. Four short, double-ended dotted corner arrows represent credential requests and responses from components that need secrets. Both fleets perform extraction and feed a shared message queue, such as SQS or RabbitMQ. The database writer validates, transforms, and loads observations. Failed messages go to a quarantine or dead-letter queue for investigation and controlled replay. Subscribers use the service API and middleware. The database is centered between the writer and middleware columns, with straight connectors entering its left and right centers. The Resilient Logging Subsystem, using a service such as CloudWatch or DigitalOcean Managed OpenSearch, sits below the database in the Management Plane. Four short dotted corner arrows point into it, representing logs from every component going to one shared destination. Logging, Metrics Store, and Managed Secrets Store share the upper Management Plane row, with Monitoring and Alerting below them. Metrics from every component reach the shared Metrics Store, shown with four inward dotted corner arrows. The Monitoring Platform connects bidirectionally to the Metrics Store and Service Alerting System. Below the service boundary, the Service Ops Team receives one-way alerts and interacts bidirectionally with Monitoring. Lighter inner boundaries separate the Data Plane (ingestion and serving, including quarantine and the database) from the Management Plane (shared operational services). These are logical responsibility groups, not independent infrastructure or failure domains. A separate dotted group labeled External Data Sources encloses the two providers outside the dotted web service boundary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#414855"/>
    </marker>
    <marker id="log-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #252334; text-anchor: middle; }
    .plane { fill: none; stroke: #a8b3c2; stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
    .plane-label { font-size: 18px; font-weight: 600; fill: #58677b; }
    .node { fill: #f0edff; stroke: #927acc; stroke-width: 2; }
    .title { font-size: 22px; font-weight: 600; }
    .detail { font-size: 18px; }
    .small { font-size: 16px; }
    .flow { fill: none; stroke: #414855; stroke-width: 2; marker-end: url(#arrow); }
    .both { marker-start: url(#arrow); }
    .replay { stroke-dasharray: 5 4; }
    .secrets-flow { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 1 4; stroke-linecap: round; marker-start: url(#log-arrow); marker-end: url(#log-arrow); }
    .log-flow, .metric-flow { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 1 4; stroke-linecap: round; marker-end: url(#log-arrow); }
  </style>
  <rect width="1290" height="1615" fill="#ffffff"/>

  <!-- Label's bottom is y=45; translated source boxes start at y=70: 25px padding. -->
  <g aria-label="External Data Sources">
    <rect x="190" y="15" width="680" height="185" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
    <text x="530" y="45" dominant-baseline="text-after-edge" style="font-size: 18px; font-weight: 600;">External Data Sources</text>
  </g>

  <g transform="translate(0, 30)">

  <!-- Each external source is directly above its reader fleet. -->
  <g aria-label="External Data Source 1">
    <rect class="node" x="210" y="40" width="240" height="100"/>
    <text class="title" x="330" y="80">External Data</text>
    <text class="title" x="330" y="110">Source 1</text>
  </g>
  <g aria-label="External Data Source N">
    <rect class="node" x="610" y="40" width="240" height="100"/>
    <text class="title" x="730" y="80">External Data</text>
    <text class="title" x="730" y="110">Source <tspan font-style="italic">N</tspan></text>
  </g>
  <g aria-label="Subscribers">
    <rect class="node" x="945" y="40" width="240" height="100"/>
    <text class="title" x="1065" y="80">Subscribers</text>
    <text class="detail" x="1065" y="112">Paid monthly access</text>
  </g>

  <!-- Preserve the gap below the transfer label and add matching space above it. -->
  <g transform="translate(0, 50)">
  <rect x="5" y="250" width="1280" height="1100" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <text x="40" y="1338" style="text-anchor: start; font-size: 18px; font-weight: 600;">Web service: our sphere of control</text>

  <g aria-label="Data Plane: ingestion and serving">
    <rect class="plane" x="35" y="280" width="1220" height="580" rx="8"/>
    <text class="plane-label" x="645" y="848">Data Plane — ingestion and serving</text>
  </g>
  <g aria-label="Management Plane: shared operational services">
    <rect class="plane" x="35" y="890" width="1220" height="400" rx="8"/>
    <text class="plane-label" x="45" y="1278" style="text-anchor: start;">Management Plane — shared operational services</text>
  </g>

  <path class="flow both" d="M 330 90 V 310"/>
  <path class="flow both" d="M 730 90 V 310"/>
  <g aria-label="HTTPS Connections: REST polling, WebSocket push, etc." font-style="italic">
    <text class="detail" x="530" y="180">HTTPS Connections</text>
    <text class="detail" x="530" y="207">REST polling, WebSocket push, etc.</text>
  </g>
  <path class="flow" d="M 1065 90 V 310"/>

  <!-- Match 30px outer-to-plane and plane-to-reader padding. -->
  <g transform="translate(0, 30)">
  <!-- Reader fleets and subscriber queries share the same row. -->
  <g aria-label="Datasource 1 Resilient Reader Fleet">
    <rect class="node" x="210" y="280" width="240" height="100"/>
    <text class="title" x="330" y="305">Datasource 1</text>
    <text class="title" x="330" y="329">Resilient</text>
    <text class="title" x="330" y="353">Reader Fleet</text>

    <text x="330" y="372" style="font-size: 14px;">Extract (E)</text>
  </g>
  <g aria-label="Datasource N Resilient Reader Fleet">
    <rect class="node" x="610" y="280" width="240" height="100"/>
    <text class="title" x="730" y="305">Datasource <tspan font-style="italic">N</tspan></text>
    <text class="title" x="730" y="329">Resilient</text>
    <text class="title" x="730" y="353">Reader Fleet</text>

    <text x="730" y="372" style="font-size: 14px;">Extract (E)</text>
  </g>

  <g aria-label="Web queries">
    <rect class="node" x="945" y="280" width="240" height="100"/>
    <text class="title" x="1065" y="320">Web queries</text>
    <text class="detail" x="1065" y="350">Subscriber requests</text>
  </g>

  <path class="flow" d="M 330 380 V 520 H 410"/>
  <path class="flow" d="M 730 380 V 520 H 650"/>
  <path class="flow" d="M 1065 380 V 470"/>
  <g aria-label="Resilient message queue">
    <rect class="node" x="410" y="470" width="240" height="100"/>
    <text class="title" x="530" y="500">Resilient</text>
    <text class="title" x="530" y="527">Message Queue</text>
    <text class="small" x="530" y="552">(e.g., SQS, RabbitMQ)</text>
  </g>
  <g aria-label="Service API">
    <rect class="node" x="945" y="470" width="240" height="100"/>
    <text class="title" x="1065" y="510">Service API</text>
    <text class="detail" x="1065" y="542">Web service entry point</text>
  </g>

  <path class="flow" d="M 530 570 V 630"/>
  <path class="flow" d="M 1065 570 V 630"/>
  <g aria-label="Resilient database writer">
    <rect class="node" x="410" y="630" width="240" height="90"/>
    <text class="title" x="530" y="654">Resilient</text>
    <text class="title" x="530" y="680">DB Writer</text>
    <text x="530" y="705" style="font-size: 14px;">Validate / Transform / Load</text>
  </g>
  <!-- Failed processing is isolated; replay returns through the normal queue. -->
  <path class="flow" d="M 410 675 H 345"/>
  <text x="377.5" y="695" style="font-size: 12px;">Failed</text>
  <path class="flow replay" d="M 345 630 L 410 570"/>
  <text x="330" y="590" style="font-size: 13px;">Controlled replay</text>
  <g aria-label="Failed Ingest Messages / Quarantine, dead-letter queue">
    <rect class="node" x="105" y="630" width="240" height="90"/>
    <text x="225" y="655" style="font-size: 18px; font-weight: 600;">Failed Ingest Messages</text>
    <text x="225" y="681" style="font-size: 18px; font-weight: 600;">Quarantine (DLQ)</text>
    <text x="225" y="705" style="font-size: 14px;">Inspect / fix / replay</text>
  </g>
  <g aria-label="Middleware">
    <rect class="node" x="945" y="630" width="240" height="90"/>
    <text class="title" x="1065" y="665">Middleware</text>
    <text class="detail" x="1065" y="695">Request processing</text>
  </g>

  <!-- Database x=797.5 is midway between writer x=530 and middleware x=1065. -->
  <path class="flow" d="M 650 675 H 722.5"/>
  <path class="flow" d="M 945 675 H 872.5"/>
  <g aria-label="Service database, PostgreSQL and TimescaleDB">
    <path class="node" d="M 722.5 580 V 770 C 722.5 790 872.5 790 872.5 770 V 580 Z"/>
    <ellipse class="node" cx="797.5" cy="580" rx="75" ry="15"/>
    <text class="title" x="797.5" y="635">Service</text>
    <text class="title" x="797.5" y="665">Database</text>
    <text x="797.5" y="699" style="font-size: 14px;">(PostgreSQL +</text>
    <text x="797.5" y="720" style="font-size: 14px;">TimescaleDB)</text>
  </g>

  <g transform="translate(255, 290)">
  <!-- Short double-ended arrows symbolize credential requests and responses. -->
  <g aria-label="Components request and receive credentials from the Managed Secrets Store">
    <path class="secrets-flow" d="M 670 610 L 690 630"/>
    <path class="secrets-flow" d="M 950 610 L 930 630"/>
    <path class="secrets-flow" d="M 670 740 L 690 720"/>
    <path class="secrets-flow" d="M 950 740 L 930 720"/>
  </g>
  <g aria-label="Managed Secrets Store: credentials and connection configuration">
    <rect class="node" x="690" y="630" width="240" height="90"/>
    <text class="title" x="810" y="655">Managed</text>
    <text class="title" x="810" y="682">Secrets Store</text>
    <text x="810" y="707" style="font-size: 14px;">Credentials &amp; connection config</text>
  </g>

  </g>

  <g transform="translate(-552.5, 290)">
  <!-- Short inward arrows symbolize every component using one logical log destination. -->
  <g aria-label="Every component sends logs to the Resilient Logging Subsystem">
    <path class="log-flow" d="M 637.5 610 L 657.5 630"/>
    <path class="log-flow" d="M 917.5 610 L 897.5 630"/>
    <path class="log-flow" d="M 637.5 740 L 657.5 720"/>
    <path class="log-flow" d="M 917.5 740 L 897.5 720"/>
  </g>
  <g aria-label="Resilient Logging Subsystem">
    <rect class="node" x="657.5" y="630" width="240" height="90"/>
    <text class="title" x="777.5" y="650">Resilient Logging</text>
    <text class="title" x="777.5" y="673">Subsystem</text>
    <text x="777.5" y="693" style="font-size: 14px;">(e.g., CloudWatch,</text>
    <text x="777.5" y="710" style="font-size: 14px;">DO Managed OpenSearch)</text>
  </g>

  </g>

  <g transform="translate(460, -220)">
  <g aria-label="Metrics from every component reach the shared Metrics Store">
    <path class="metric-flow" d="M 45 1120 L 65 1140"/>
    <path class="metric-flow" d="M 325 1120 L 305 1140"/>
    <path class="metric-flow" d="M 45 1250 L 65 1230"/>
    <path class="metric-flow" d="M 325 1250 L 305 1230"/>
  </g>
  <g aria-label="Metrics Store">
    <rect class="node" x="65" y="1140" width="240" height="90"/>
    <text class="title" x="185" y="1177">Metrics</text>
    <text class="title" x="185" y="1205">Store</text>
  </g>
  </g>
  <path class="flow both" d="M 645 1010 V 1100"/>

  <g transform="translate(0, -40)">
  <!-- Shared observability roles; these may be provided by one managed service. -->
  <g aria-label="Monitoring Platform">
    <rect class="node" x="525" y="1140" width="240" height="90"/>
    <text class="title" x="645" y="1177">Monitoring</text>
    <text class="title" x="645" y="1205">Platform</text>
  </g>
  <path class="flow both" d="M 765 1185 H 945"/>
  <g aria-label="Service Alerting System">
    <rect class="node" x="945" y="1140" width="240" height="90"/>
    <text class="title" x="1065" y="1177">Service Alerting</text>
    <text class="title" x="1065" y="1205">System</text>
  </g>

  </g>

  <!-- Operators are outside the running service; alert delivery is one-way. -->
  <path class="flow both" d="M 645 1190 V 1390"/>
  <path class="flow" d="M 1065 1190 V 1435 H 765"/>
  <g aria-label="Service Ops Team">
    <rect class="node" x="525" y="1390" width="240" height="90"/>
    <text class="title" x="645" y="1425">Service Ops</text>
    <text class="title" x="645" y="1455">Team</text>
  </g>
  </g>
  </g>
  </g>
</svg>
