    <text class="title" x="810" y="655">Managed</text>
    <text class="title" x="810" y="682">Secrets Store</text>
    <text x="810" y="707" style="font-size: 14px;">Credentials &amp; connection config</text>
  </g>

  </g>

  <g transform="translate(-552.5, 617)">
  <!-- Short inward arrows symbolize every component using one logical log destination. -->
  <g aria-label="Every component sends logs to the Resilient Logging Subsystem">
    <path class="log-flow" d="M 637.5 610 L 657.5 630"/>
    <path class="log-flow" d="M 917.5 610 L 897.5 630"/>
    <path class="log-flow" d="M 637.5 740 L 657.5 720"/>
    <path class="log-flow" d="M 917.5 740 L 897.5 720"/>
  </g>
  <g aria-label="Resilient Logging Subsystem">
    <rect class="node" x="657.5" y="630" width="240" height="90"/>
    <text class="title" x="777.5" y="650">Resilient Logging</text>
    <text class="title" x="777.5" y="673">Subsystem</text>
    <text x="777.5" y="693" style="font-size: 14px;">(e.g., CloudWatch,</text>
    <text x="777.5" y="710" style="font-size: 14px;">DO Managed OpenSearch)</text>
  </g>

  </g>

  <g transform="translate(348.75, 107)">
  <g aria-label="Metrics from every component reach the shared Metrics Store">
    <path class="metric-flow" d="M 45 1120 L 65 1140"/>
    <path class="metric-flow" d="M 325 1120 L 305 1140"/>
    <path class="metric-flow" d="M 45 1250 L 65 1230"/>
    <path class="metric-flow" d="M 325 1250 L 305 1230"/>
  </g>
  <g aria-label="Metrics Store">
    <rect class="node" x="65" y="1140" width="240" height="90"/>
    <text class="title" x="185" y="1177">Metrics</text>
    <text class="title" x="185" y="1205">Store</text>
  </g>
  </g>
  <path class="flow both" d="M 533.75 1337 V 1437"/>

  <g transform="translate(0, 297)">
  <!-- Shared operational roles may be supplied by the hosting platform. -->
  <g aria-label="Service Health Management: workload control and status">
    <path class="control-flow" d="M 85 1120 L 105 1140"/>
    <path class="control-flow" d="M 365 1120 L 345 1140"/>
    <path class="control-flow" d="M 85 1250 L 105 1230"/>
    <path class="control-flow" d="M 365 1250 L 345 1230"/>
  </g>
  <g aria-label="Service Health Management: right-size and replace unhealthy instances">
    <rect class="node" x="105" y="1140" width="240" height="90"/>
    <text class="title" x="225" y="1167">Service Health</text>
    <text class="title" x="225" y="1194">Management</text>
    <text x="225" y="1217" style="font-size: 12px;">Right-size • replace unhealthy instances</text>
  </g>
  <path class="flow both" d="M 345 1185 H 413.75"/>

  <g aria-label="Monitoring Platform">
    <rect class="node" x="413.75" y="1140" width="240" height="90"/>
    <text class="title" x="533.75" y="1177">Monitoring</text>
    <text class="title" x="533.75" y="1205">Platform</text>
  </g>
  <path class="flow both" d="M 653.75 1185 H 945"/>
  <g aria-label="Service Ops Team Alerting System">
    <rect class="node" x="945" y="1140" width="240" height="90"/>
    <text class="title" x="1065" y="1177">Service Ops Team</text>
    <text class="title" x="1065" y="1205">Alerting System</text>
  </g>

  </g>

  <!-- Ops top is 1700 + 60 - 160 from the content transforms: 30px below the outer border at 1570. -->
  <!-- Operators are outside the running service; alert delivery is one-way. -->
  <path class="flow both" d="M 533.75 1527 V 1700"/>
  <path class="flow" d="M 1065 1527 V 1745 H 653.75"/>
  <g aria-label="Service Ops Team">
    <rect class="node" x="413.75" y="1700" width="240" height="90"/>
    <text class="title" x="533.75" y="1735">Service Ops</text>
    <text class="title" x="533.75" y="1765">Team</text>
  </g>
  </g>
  </g>
  </g>
  </g>
  </g>
</svg>
