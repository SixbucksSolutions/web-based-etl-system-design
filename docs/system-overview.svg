<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="1085" viewBox="0 0 1290 1085" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Web service system overview</title>
  <desc id="diagram-description">External Data Source 1 and External Data Source N each connect to their own resilient reader fleet through REST polling, WebSocket push, or other supported transfer methods. The Managed Secrets Store sits between the fleets on the same row, with a solid, double-ended connection to each. Both fleets feed a shared message queue, such as SQS or RabbitMQ, and database writer. Subscribers use the service API and middleware. The database is centered between the writer and middleware columns, with right-angle connectors entering its left and right centers. The Resilient Logging Subsystem sits between the writer and middleware, centered over the database. Eight short dotted arrows point into it, representing logs from every component going to one shared destination. A separate dotted group labeled External Data Sources encloses the two providers outside the dotted web service boundary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#414855"/>
    </marker>
    <marker id="log-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #252334; text-anchor: middle; }
    .node { fill: #f0edff; stroke: #927acc; stroke-width: 2; }
    .title { font-size: 22px; font-weight: 600; }
    .detail { font-size: 18px; }
    .small { font-size: 16px; }
    .flow { fill: none; stroke: #414855; stroke-width: 2; marker-end: url(#arrow); }
    .both { marker-start: url(#arrow); }
    .log-flow { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 1 4; stroke-linecap: round; marker-end: url(#log-arrow); }
  </style>
  <rect width="1290" height="1085" fill="#ffffff"/>

  <!-- Label's bottom is y=45; translated source boxes start at y=70: 25px padding. -->
  <g aria-label="External Data Sources">
    <rect x="20" y="15" width="810" height="185" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
    <text x="425" y="45" dominant-baseline="text-after-edge" style="font-size: 18px; font-weight: 600;">External Data Sources</text>
  </g>

  <g transform="translate(0, 30)">

  <!-- Each external source is directly above its reader fleet. -->
  <g aria-label="External Data Source 1">
    <rect class="node" x="40" y="40" width="240" height="100"/>
    <text class="title" x="160" y="80">External Data</text>
    <text class="title" x="160" y="110">Source 1</text>
  </g>
  <g aria-label="External Data Source N">
    <rect class="node" x="570" y="40" width="240" height="100"/>
    <text class="title" x="690" y="80">External Data</text>
    <text class="title" x="690" y="110">Source <tspan font-style="italic">N</tspan></text>
  </g>
  <g aria-label="Subscribers">
    <rect class="node" x="1010" y="40" width="240" height="100"/>
    <text class="title" x="1130" y="80">Subscribers</text>
    <text class="detail" x="1130" y="112">Paid monthly access</text>
  </g>

  <!-- Preserve the gap below the transfer label and add matching space above it. -->
  <g transform="translate(0, 50)">
  <rect x="20" y="250" width="1250" height="730" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <text x="645" y="968" style="font-size: 18px; font-weight: 600;">Web service: our sphere of control</text>

  <path class="flow both" d="M 160 90 V 280"/>
  <path class="flow both" d="M 690 90 V 280"/>
  <g aria-label="HTTPS Connections: REST polling, WebSocket push, etc." font-style="italic">
    <text class="detail" x="425" y="180">HTTPS Connections</text>
    <text class="detail" x="425" y="207">REST polling, WebSocket push, etc.</text>
  </g>
  <path class="flow" d="M 1130 90 V 280"/>

  <!-- Both fleets and their shared Managed Secrets Store align at y=330. -->
  <g aria-label="Datasource 1 Resilient Reader Fleet">
    <rect class="node" x="40" y="280" width="240" height="100"/>
    <text class="title" x="160" y="310">Datasource 1</text>
    <text class="title" x="160" y="337">Resilient</text>
    <text class="title" x="160" y="364">Reader Fleet</text>
  </g>
  <g aria-label="Managed Secrets Store">
    <rect class="node" x="330" y="285" width="190" height="90" rx="12"/>
    <text class="title" x="425" y="320">Managed</text>
    <text class="title" x="425" y="350">Secrets Store</text>
  </g>
  <g aria-label="Datasource N Resilient Reader Fleet">
    <rect class="node" x="570" y="280" width="240" height="100"/>
    <text class="title" x="690" y="310">Datasource <tspan font-style="italic">N</tspan></text>
    <text class="title" x="690" y="337">Resilient</text>
    <text class="title" x="690" y="364">Reader Fleet</text>
  </g>
  <path class="flow both" d="M 280 330 H 330"/>
  <path class="flow both" d="M 520 330 H 570"/>

  <g aria-label="Web queries">
    <rect class="node" x="1010" y="280" width="240" height="100"/>
    <text class="title" x="1130" y="320">Web queries</text>
    <text class="detail" x="1130" y="350">Subscriber requests</text>
  </g>

  <path class="flow" d="M 160 380 V 520 H 305"/>
  <path class="flow" d="M 690 380 V 520 H 545"/>
  <path class="flow" d="M 1130 380 V 470"/>
  <g aria-label="Resilient message queue">
    <rect class="node" x="305" y="470" width="240" height="100"/>
    <text class="title" x="425" y="500">Resilient</text>
    <text class="title" x="425" y="527">Message Queue</text>
    <text class="small" x="425" y="552">(e.g., SQS, RabbitMQ)</text>
  </g>
  <g aria-label="Service API">
    <rect class="node" x="1010" y="470" width="240" height="100"/>
    <text class="title" x="1130" y="510">Service API</text>
    <text class="detail" x="1130" y="542">Web service entry point</text>
  </g>

  <path class="flow" d="M 425 570 V 630"/>
  <path class="flow" d="M 1130 570 V 630"/>
  <g aria-label="Resilient database writer">
    <rect class="node" x="305" y="630" width="240" height="90"/>
    <text class="title" x="425" y="665">Resilient</text>
    <text class="title" x="425" y="695">DB Writer</text>
  </g>
  <g aria-label="Middleware">
    <rect class="node" x="1010" y="630" width="240" height="90"/>
    <text class="title" x="1130" y="665">Middleware</text>
    <text class="detail" x="1130" y="695">Request processing</text>
  </g>

  <!-- Short inward arrows symbolize every component using one logical log destination. -->
  <g aria-label="Every component sends logs to the Resilient Logging Subsystem">
    <path class="log-flow" d="M 777.5 602 V 630"/>
    <path class="log-flow" d="M 777.5 748 V 720"/>
    <path class="log-flow" d="M 629.5 675 H 657.5"/>
    <path class="log-flow" d="M 925.5 675 H 897.5"/>
    <path class="log-flow" d="M 637.5 610 L 657.5 630"/>
    <path class="log-flow" d="M 917.5 610 L 897.5 630"/>
    <path class="log-flow" d="M 637.5 740 L 657.5 720"/>
    <path class="log-flow" d="M 917.5 740 L 897.5 720"/>
  </g>
  <g aria-label="Resilient Logging Subsystem">
    <rect class="node" x="657.5" y="630" width="240" height="90"/>
    <text class="title" x="777.5" y="655">Resilient</text>
    <text class="title" x="777.5" y="682">Logging</text>
    <text class="title" x="777.5" y="709">Subsystem</text>
  </g>

  <!-- Database x=777.5 is midway between writer x=425 and middleware x=1130. -->
  <path class="flow" d="M 425 720 V 845 H 657.5"/>
  <path class="flow" d="M 1130 720 V 845 H 897.5"/>
  <g aria-label="Service database, PostgreSQL and TimescaleDB">
    <path class="node" d="M 657.5 805 V 885 C 657.5 909 897.5 909 897.5 885 V 805 Z"/>
    <ellipse class="node" cx="777.5" cy="805" rx="120" ry="18"/>
    <text class="title" x="777.5" y="848">Service database</text>
    <text class="small" x="777.5" y="877">PostgreSQL + TimescaleDB</text>
  </g>
  </g>
  </g>
</svg>
