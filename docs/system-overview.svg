<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="1795" viewBox="0 0 1290 1795" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Web service system overview</title>
  <desc id="diagram-description">External Data Source 1 and External Data Source N each connect to their own resilient reader fleet through REST polling, WebSocket push, or other supported transfer methods. The Managed Secrets Store holds credentials and connection configuration in the lower Management Plane. Four short, double-ended dotted corner arrows represent credential requests and responses from components that need secrets. Both fleets perform extraction and feed a shared message queue, such as SQS or RabbitMQ. The database writer validates, transforms, and loads observations. Failed messages go to a quarantine or dead-letter queue for investigation and controlled replay. Customers resolve foobar.com and api.foobar.com through a Managed DNS Service on a lookaside query-and-response branch above and to the left of the CDN. HTTPS requests go directly to the CDN, which serves the landing page and assets and fetches or revalidates content from the foobar.com origin server. The browser application sends separate HTTPS API requests to an API Load Balancer, which routes them to the API Service, representing multiple server instances. The API Service connects bidirectionally to an in-memory cache, such as memcached or Valkey, shown in the same column as the failed-message quarantine. Authentication remains in the API application. DNS does not proxy web requests. The database receives ingested observations from the DB writer, and the API Service reads from it and writes user-account and session changes through a direct bidirectional connection. The Resilient Logging Subsystem, using a service such as CloudWatch or DigitalOcean Managed OpenSearch, sits below the database in the Management Plane. Four short dotted corner arrows point into it, representing logs from every component going to one shared destination. Logging, Metrics Store, and Managed Secrets Store share the upper Management Plane row, with Service Health Management, Monitoring, and Alerting below them. Metrics from every component reach the shared Metrics Store, shown with four inward dotted corner arrows. The Monitoring Platform connects bidirectionally to the Metrics Store, Service Ops Team Alerting System, and Service Health Management. Service Health Management right-sizes workloads and replaces unhealthy instances; dotted corner arrows represent workload control and status. Below the service boundary, the Service Ops Team receives one-way alerts and interacts bidirectionally with Monitoring. Lighter inner boundaries separate the Data Plane (ingestion and serving, including quarantine and the database) from the Management Plane (shared operational services). These are logical responsibility groups, not independent infrastructure or failure domains. A separate dotted group labeled External Data Sources encloses the two providers outside the dotted web service boundary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#414855"/>
    </marker>
    <marker id="log-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1e293b; text-anchor: middle; }
    .plane { fill: none; stroke: #a8b3c2; stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
    .plane-label { font-size: 18px; font-weight: 600; fill: #58677b; }
    .node { fill: #eaf4ff; stroke: #4b8bc4; stroke-width: 2; }
    .title { font-size: 22px; font-weight: 600; }
    .detail { font-size: 18px; }
    .small { font-size: 16px; }
    .flow { fill: none; stroke: #414855; stroke-width: 2; marker-end: url(#arrow); }
    .both { marker-start: url(#arrow); }
    .replay { stroke-dasharray: 5 4; }
    .secrets-flow, .control-flow { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 1 4; stroke-linecap: round; marker-start: url(#log-arrow); marker-end: url(#log-arrow); }
    .log-flow, .metric-flow { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 1 4; stroke-linecap: round; marker-end: url(#log-arrow); }
  </style>
  <rect width="1290" height="1795" fill="#ffffff"/>

  <!-- Source boxes have 30px clearance below the label and to the group sides/bottom. -->
  <g aria-label="External Data Sources">
    <rect x="183.75" y="10" width="700" height="190" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
    <text x="533.75" y="40" dominant-baseline="text-after-edge" style="font-size: 18px; font-weight: 600;">External Data Sources</text>
  </g>

  <g transform="translate(0, 30)">

  <!-- Each external source is directly above its reader fleet. -->
  <g aria-label="External Data Source 1">
    <rect class="node" x="213.75" y="40" width="240" height="100"/>
    <text class="title" x="333.75" y="80">External Data</text>
    <text class="title" x="333.75" y="110">Source 1</text>
  </g>
  <g aria-label="External Data Source N">
    <rect class="node" x="613.75" y="40" width="240" height="100"/>
    <text class="title" x="733.75" y="80">External Data</text>
    <text class="title" x="733.75" y="110">Source <tspan font-style="italic">N</tspan></text>
  </g>
  <g aria-label="Customers: multiple people">
    <!-- Original geometric group-of-people icon; no external icon asset. -->
    <g transform="translate(1065, 55)" fill="#ffffff" stroke="#4b8bc4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="-30" cy="0" r="8"/>
      <path d="M -45 28 V 17 C -45 3 -15 3 -15 17 V 28 Z"/>
      <circle cx="30" cy="0" r="8"/>
      <path d="M 15 28 V 17 C 15 3 45 3 45 17 V 28 Z"/>
      <circle cx="0" cy="-7" r="10"/>
      <path d="M -22 34 V 18 C -22 0 22 0 22 18 V 34 Z"/>
    </g>
    <text class="title" x="1065" y="20">Customers</text>
  </g>

  <!-- Preserve the gap below the transfer label and add matching space above it. -->
  <g transform="translate(0, 50)">
  <rect x="5" y="250" width="1280" height="1320" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <text x="40" y="1558" style="text-anchor: start; font-size: 18px; font-weight: 600;">Web service: our sphere of control</text>

  <g aria-label="Data Plane: ingestion and serving">
    <rect class="plane" x="35" y="280" width="1220" height="777" rx="8"/>
    <!-- Lowest API row ends at 932 + 60 from its content transforms; label top is 1022: 30px gap. -->
    <text class="plane-label" x="645" y="1022" dominant-baseline="text-before-edge">Data Plane — ingestion and serving</text>
  </g>
  <g aria-label="Management Plane: shared operational services">
    <rect class="plane" x="35" y="1087" width="1220" height="423" rx="8"/>
    <!-- Health-arrow lower endpoints are at 1250 + 297 + 60 - 160 = 1447; label top is 30px below. -->
    <text class="plane-label" x="45" y="1477" dominant-baseline="text-before-edge" style="text-anchor: start;">Management Plane — shared operational services</text>
  </g>

  <path class="flow both" d="M 333.75 90 V 310"/>
  <path class="flow both" d="M 733.75 90 V 310"/>
  <g aria-label="HTTPS Connections: REST polling, WebSocket push, etc." font-style="italic">
    <text class="detail" x="533.75" y="180">HTTPS Connections</text>
    <text class="detail" x="533.75" y="207">REST polling, WebSocket push, etc.</text>
  </g>
  <!-- DNS is a lookaside lookup; the browser calls the CDN and API endpoint separately. -->
  <path class="flow both" d="M 1065 39 V 500"/>
  <path class="flow both" d="M 1020 27.5 H 975 V 310"/>
  <path class="flow both" d="M 1110 27.5 H 1225 V 947 H 1185"/>

  <!-- Match 30px outer-to-plane and plane-to-reader padding. -->
  <g transform="translate(0, 30)">
  <!-- Reader fleets and DNS share a 280..410 row; the next row starts at 470, leaving the standard 60px gap. -->
  <!-- Reader fleets share a row; the customer edge uses an offset DNS lookaside. -->
  <g aria-label="Datasource 1 Resilient Reader Fleet">
    <rect class="node" x="213.75" y="280" width="240" height="130"/>
    <text class="title" x="333.75" y="320">Datasource 1</text>
    <text class="title" x="333.75" y="344">Resilient</text>
    <text class="title" x="333.75" y="368">Reader Fleet</text>

    <text x="333.75" y="387" style="font-size: 14px;">Extract (E)</text>
  </g>
  <g aria-label="Datasource N Resilient Reader Fleet">
    <rect class="node" x="613.75" y="280" width="240" height="130"/>
    <text class="title" x="733.75" y="320">Datasource <tspan font-style="italic">N</tspan></text>
    <text class="title" x="733.75" y="344">Resilient</text>
    <text class="title" x="733.75" y="368">Reader Fleet</text>

    <text x="733.75" y="387" style="font-size: 14px;">Extract (E)</text>
  </g>

  <g aria-label="Managed DNS Service for foobar.com and api.foobar.com, lookaside lookup">
    <rect class="node" x="905" y="280" width="140" height="130"/>
    <text class="title" x="975" y="307">Managed</text>
    <text class="title" x="975" y="333">DNS</text>
    <text class="title" x="975" y="359">Service</text>
    <text x="975" y="383" style="font-size: 14px;">foobar.com</text>
    <text x="975" y="401" style="font-size: 14px;">api.foobar.com</text>
  </g>

  <path class="flow" d="M 333.75 410 V 520 H 413.75"/>
  <path class="flow" d="M 733.75 410 V 520 H 653.75"/>

  <!-- Shift the second row and everything below it together to preserve existing gaps. -->
  <g transform="translate(0, 30)">
  <g aria-label="CDN for cached static assets">
    <rect class="node" x="945" y="440" width="240" height="100"/>
    <text class="title" x="1065" y="482">CDN</text>
    <text class="small" x="1065" y="510">cached static assets</text>
  </g>

  <path class="flow both" d="M 1065 540 V 665"/>
  <g aria-label="Resilient message queue">
    <rect class="node" x="413.75" y="440" width="240" height="100"/>
    <text class="title" x="533.75" y="470">Resilient</text>
    <text class="title" x="533.75" y="497">Message Queue</text>
    <text class="small" x="533.75" y="522">(e.g., SQS, RabbitMQ)</text>
  </g>
  <g aria-label="Origin Server for foobar.com static assets">
    <rect class="node" x="945" y="665" width="240" height="90"/>
    <text class="title" x="1065" y="700">Origin Server</text>
    <text class="small" x="1065" y="730">foobar.com static assets</text>
  </g>

  <path class="flow" d="M 533.75 540 V 665"/>
  <g aria-label="Resilient database writer">
    <rect class="node" x="413.75" y="665" width="240" height="90"/>
    <text class="title" x="533.75" y="689">Resilient</text>
    <text class="title" x="533.75" y="715">DB Writer</text>
    <text x="533.75" y="740" style="font-size: 14px;">Validate / Transform / Load</text>
  </g>
  <!-- Failed processing is isolated; replay returns through the normal queue. -->
  <path class="flow" d="M 413.75 710 H 345"/>
  <text x="379.375" y="730" style="font-size: 12px;">Failed</text>
  <path class="flow replay" d="M 345 665 L 413.75 540"/>
  <text x="321.875" y="602.5" style="font-size: 13px;">Controlled replay</text>
  <g aria-label="Failed Ingest Messages / Quarantine, dead-letter queue">
    <rect class="node" x="105" y="665" width="240" height="90"/>
    <text x="225" y="690" style="font-size: 18px; font-weight: 600;">Failed Ingest Messages</text>
    <text x="225" y="716" style="font-size: 18px; font-weight: 600;">Quarantine (DLQ)</text>
    <text x="225" y="740" style="font-size: 14px;">Inspect / fix / replay</text>
  </g>


  <!-- Ingested observations enter the service database from the writer. -->
  <path class="flow both" d="M 653.75 710 H 722.5"/>
  <text x="688.125" y="699" style="font-size: 12px;">Writes</text>
  <!-- Front ellipse edge y=630; text ink is approximately y=654..758; body bottom y=782. -->
  <g aria-label="Service database, PostgreSQL and TimescaleDB">
    <path class="node" d="M 722.5 615 V 767 C 722.5 787 872.5 787 872.5 767 V 615 Z"/>
    <ellipse class="node" cx="797.5" cy="615" rx="75" ry="15"/>
    <text class="title" x="797.5" y="670">Service</text>
    <text class="title" x="797.5" y="700">Database</text>
    <text x="797.5" y="734" style="font-size: 14px;">(PostgreSQL +</text>
    <text x="797.5" y="755" style="font-size: 14px;">TimescaleDB)</text>
  </g>

  <!-- Application API calls are separate from static landing-page delivery. -->
  <path class="flow both" d="M 653.75 842 L 722.5 767"/>
  <text x="688.125" y="840" style="font-size: 12px;">
    <tspan x="688.125">Reads</tspan>
    <tspan x="688.125" dy="14">+</tspan>
    <tspan x="688.125" dy="14">Writes</tspan>
  </text>
  <g aria-label="API Load Balancer for api.foobar.com">
    <rect class="node" x="945" y="842" width="240" height="90"/>
    <text class="title" x="1065" y="876">API Load Balancer</text>
    <text class="detail" x="1065" y="905">api.foobar.com</text>
  </g>
  <path class="flow both" d="M 945 887 H 653.75"/>
  <g aria-label="API Service: multiple server instances">
    <rect class="node" x="413.75" y="842" width="240" height="90"/>
    <text class="title" x="533.75" y="876">API Service</text>
    <text x="533.75" y="905" style="font-size: 14px;">Auth + application requests</text>
  </g>
  <path class="flow both" d="M 413.75 887 H 345"/>
  <g aria-label="In-memory cache, for example memcached or Valkey">
    <rect class="node" x="105" y="842" width="240" height="90"/>
    <text class="title" x="225" y="876">In-memory Cache</text>
    <text class="small" x="225" y="905">(e.g., memcached, Valkey)</text>
  </g>

  <!-- Close the vacated API row while preserving management-plane spacing. -->
  <g transform="translate(0, -160)">
  <g transform="translate(255, 617)">
  <!-- Short double-ended arrows symbolize credential requests and responses. -->
  <g aria-label="Components request and receive credentials from the Managed Secrets Store">
    <path class="secrets-flow" d="M 670 610 L 690 630"/>
    <path class="secrets-flow" d="M 950 610 L 930 630"/>
    <path class="secrets-flow" d="M 670 740 L 690 720"/>
    <path class="secrets-flow" d="M 950 740 L 930 720"/>
  </g>
  <g aria-label="Managed Secrets Store: credentials and connection configuration">
