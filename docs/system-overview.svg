<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="950" viewBox="0 0 1024 950" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Web service system overview</title>
  <desc id="diagram-description">Readers poll an external authenticated REST API. The Managed Secrets Store sits directly to the left of the reader fleet, connected by a solid, double-ended arrow. Updates flow vertically through the readers, RabbitMQ message queue, and database writer. Subscribers use the service API and middleware. The database is centered between the two columns, with right-angle connectors entering its left and right centers. A dotted boundary encloses the service components.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#414855"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #252334; text-anchor: middle; }
    .node { fill: #f0edff; stroke: #927acc; stroke-width: 2; }
    .title { font-size: 22px; font-weight: 600; }
    .detail { font-size: 18px; }
    .small { font-size: 16px; }
    .flow { fill: none; stroke: #414855; stroke-width: 2; marker-end: url(#arrow); }
    .both { marker-start: url(#arrow); }
  </style>
  <rect width="1024" height="950" fill="#ffffff"/>

  <!-- The source, readers, queue, and writer share x=440. -->
  <g aria-label="External API">
    <rect class="node" x="320" y="40" width="240" height="100"/>
    <text class="title" x="440" y="73">External API</text>
    <text class="detail" x="440" y="102">Authenticated REST</text>
    <text class="detail" x="440" y="127">1-minute updates</text>
  </g>
  <g aria-label="Subscribers">
    <rect class="node" x="745" y="40" width="240" height="100"/>
    <text class="title" x="865" y="80">Subscribers</text>
    <text class="detail" x="865" y="112">Paid monthly access</text>
  </g>

  <rect x="25" y="240" width="990" height="680" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <text x="50" y="270" style="text-anchor: start; font-size: 18px; font-weight: 600;">Web service: our sphere of control</text>

  <path class="flow both" d="M 440 140 V 300"/>
  <rect x="365" y="194" width="150" height="29" rx="3" fill="#ffffff"/>
  <text x="440" y="215" style="font-size: 17px;">Poll for updates</text>
  <path class="flow" d="M 865 140 V 300"/>

  <!-- Managed Secrets Store and readers share y=345. The store is outside the data path. -->
  <g aria-label="Managed Secrets Store">
    <rect class="node" x="45" y="300" width="190" height="90" rx="12"/>
    <text class="title" x="140" y="335">Managed</text>
    <text class="title" x="140" y="365">Secrets Store</text>
  </g>
  <g aria-label="Resilient reader fleet">
    <rect class="node" x="320" y="300" width="240" height="90"/>
    <text class="title" x="440" y="335">Resilient</text>
    <text class="title" x="440" y="365">Reader Fleet</text>
  </g>
  <path class="flow both" d="M 320 345 H 235"/>

  <g aria-label="Web queries">
    <rect class="node" x="745" y="300" width="240" height="90"/>
    <text class="title" x="865" y="335">Web queries</text>
    <text class="detail" x="865" y="365">Subscriber requests</text>
  </g>

  <path class="flow" d="M 440 390 V 450"/>
  <path class="flow" d="M 865 390 V 450"/>
  <g aria-label="Resilient message queue">
    <rect class="node" x="320" y="450" width="240" height="100"/>
    <text class="title" x="440" y="480">Resilient</text>
    <text class="title" x="440" y="507">Message Queue</text>
    <text class="small" x="440" y="532">RabbitMQ quorum queues</text>
  </g>
  <g aria-label="Service API">
    <rect class="node" x="745" y="450" width="240" height="100"/>
    <text class="title" x="865" y="490">Service API</text>
    <text class="detail" x="865" y="522">Web service entry point</text>
  </g>

  <path class="flow" d="M 440 550 V 610"/>
  <path class="flow" d="M 865 550 V 610"/>
  <g aria-label="Resilient database writer">
    <rect class="node" x="320" y="610" width="240" height="90"/>
    <text class="title" x="440" y="645">Resilient</text>
    <text class="title" x="440" y="675">DB Writer</text>
  </g>
  <g aria-label="Middleware">
    <rect class="node" x="745" y="610" width="240" height="90"/>
    <text class="title" x="865" y="645">Middleware</text>
    <text class="detail" x="865" y="675">Request processing</text>
  </g>

  <!-- Database x=652.5 is midway between the two column centers, 440 and 865. -->
  <path class="flow" d="M 440 700 V 825 H 532.5"/>
  <path class="flow" d="M 865 700 V 825 H 772.5"/>
  <g aria-label="Service database, PostgreSQL and TimescaleDB">
    <path class="node" d="M 532.5 785 V 865 C 532.5 889 772.5 889 772.5 865 V 785 Z"/>
    <ellipse class="node" cx="652.5" cy="785" rx="120" ry="18"/>
    <text class="title" x="652.5" y="828">Service database</text>
    <text class="small" x="652.5" y="857">PostgreSQL + TimescaleDB</text>
  </g>
</svg>
