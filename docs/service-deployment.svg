    <rect class="band" x="65" y="1145" width="860" height="60" rx="5"/>
    <rect class="band" x="65" y="1235" width="860" height="60" rx="5"/>
    <rect class="band" x="65" y="1325" width="860" height="60" rx="5"/>
    <rect class="band" x="65" y="1415" width="860" height="60" rx="5"/>
    <rect class="band" x="65" y="1505" width="860" height="60" rx="5"/>
    <rect class="band" x="65" y="1595" width="860" height="60" rx="5"/>
