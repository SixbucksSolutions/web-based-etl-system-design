    <text class="label" x="485" y="515">Valkey Primary</text>
    <text class="detail" x="485" y="543">In-memory cache</text>
  </g>
  <g aria-label="Valkey standby in the same region">
    <rect class="node" x="685" y="480" width="220" height="90" rx="6"/>
    <text class="label" x="795" y="515">Valkey Standby</text>
    <text class="detail" x="795" y="543">Node failover</text>
  </g>
    <text class="label" x="180" y="665">Database tier</text>
    <text class="detail" x="180" y="691">Eligible plan required</text>
    <text class="detail" x="180" y="714">PostgreSQL; TimescaleDB*</text>
