<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="1665" viewBox="0 0 1290 1665" role="img" aria-labelledby="deployment-title deployment-description">
  <title id="deployment-title">Future-state HA deployment across three failure domains</title>
  <desc id="deployment-description">A future-state high-availability target that can be adopted incrementally. An outer Cloud Service Provider boundary contains three shared managed services above three independent failure domains or availability zones. Four separate single-zone database instances sit inside the domains but outside the worker compute instances: Primary in domain 1, Standby Failover and Read-only Replica 2 in domain 2, and Read-only Replica 1 in domain 3. Each domain also contains one worker compute instance. Nine horizontal service bands span all three instances, with one member per instance: Datasource 1 Reader Fleet, Datasource N Reader Fleet, RabbitMQ with datasource queue and dead-letter queue, DB Writer Fleet, API Service Fleet, Service Health Management Fleet, Metrics Store, Monitoring Platform, and Service Ops Team Alerting System. The metrics store is self-hosted in this conservative footprint. Managed services above the columns require separate verification of their failure coverage; their placement does not assert automatic multi-domain resilience.</desc>
