<svg xmlns="http://www.w3.org/2000/svg" width="980" height="2300" viewBox="0 0 980 2300" role="img" aria-labelledby="deployment-title deployment-description">
  <title id="deployment-title">DigitalOcean single-region deployment with node redundancy</title>
  <desc id="deployment-description">One DigitalOcean region, illustrated by nyc3, contains a regional API load balancer, a regional Managed OpenSearch cluster, a regional Secrets Manager container, and a Managed Valkey primary and standby. A PostgreSQL primary, standby and two read-only replicas occupy the same region on an eligible configuration. Two Droplets each run six shared self-hosted service roles plus one reader per datasource, giving 12 + 2 times the number of datasources deployments. The reader row represents datasource 1 through N. Redundant instances and managed failover protect against supported node failures, not loss of the entire region. A second provider below operates the managed queue across three illustrative availability zones inside one region, protecting against an AZ failure rather than loss of that entire region. These are alternative providers, not three separate deployments. No availability-zone placement is asserted inside DigitalOcean.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1e293b; text-anchor: middle; }
    .boundary { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; }
    .compute { fill: none; stroke: #8da6be; stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
    .node { fill: #eaf4ff; stroke: #4b8bc4; stroke-width: 2; }
    .band { fill: #eaf4ff; fill-opacity: 0.55; stroke: #b7d6ef; stroke-width: 1; }
    .member { fill: #ffffff; stroke: #4b8bc4; stroke-width: 1.5; }
    .title { font-size: 22px; font-weight: 600; }
    .label { font-size: 18px; font-weight: 600; }
    .detail { font-size: 15px; }
  </style>
  <rect width="980" height="2300" fill="#ffffff"/>
  <g aria-label="DigitalOcean">
