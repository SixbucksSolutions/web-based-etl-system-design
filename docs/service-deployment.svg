<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="1875" viewBox="0 0 1290 1875" role="img" aria-labelledby="deployment-title deployment-description">
  <title id="deployment-title">Service deployment across DigitalOcean and a second cloud provider</title>
  <desc id="deployment-description">The upper DigitalOcean boundary contains three shared managed services and three illustrative failure domains. Only domains 1 and 2 contain deployments; domain 3 is intentionally empty for optional expansion. Four single-zone database instances sit outside worker VMs: Primary and Read-only Replica 1 in domain 1, and Standby Failover and Read-only Replica 2 in domain 2. Each of domains 1 and 2 contains one worker VM. Eight self-hosted service rows span both worker VMs: Datasource 1 Reader Fleet, Datasource N Reader Fleet, DB Writer Fleet, API Service Fleet, Service Health Management Fleet, Metrics Store, Monitoring Platform, and Service Ops Team Alerting System. Either worker VM must support essential load by itself. Below DigitalOcean, a second dotted provider boundary is labeled CSP 2, for example AWS, Azure, or Google. It contains three illustrative availability-zone columns spanned by one managed message queue with datasource queues and a dead-letter queue. The second provider operates queue replication; readers and writers connect over TLS. Provider examples are alternatives, not three simultaneous deployments. Managed service failure coverage, DigitalOcean placement capabilities, and any failover coordination dependencies must be verified separately.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1e293b; text-anchor: middle; }
    .boundary { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; }
    .compute { fill: none; stroke: #8da6be; stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
    .node { fill: #eaf4ff; stroke: #4b8bc4; stroke-width: 2; }
    .band { fill: #eaf4ff; fill-opacity: 0.55; stroke: #b7d6ef; stroke-width: 1; }
    .member { fill: #ffffff; stroke: #4b8bc4; stroke-width: 1.5; }
    .title { font-size: 22px; font-weight: 600; }
    .label { font-size: 18px; font-weight: 600; }
    .detail { font-size: 15px; }
  </style>
