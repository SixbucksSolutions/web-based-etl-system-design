<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="1545" viewBox="0 0 1290 1545" role="img" aria-labelledby="deployment-title deployment-description">
  <title id="deployment-title">Future-state HA deployment across three failure domains</title>
  <desc id="deployment-description">A future-state high-availability target that can be adopted incrementally. An outer Cloud Service Provider boundary contains four shared managed services above three independent failure domains or availability zones. Each domain contains one compute instance. Nine horizontal service bands span all three instances, with one member per instance: Datasource 1 Reader Fleet, Datasource N Reader Fleet, RabbitMQ with datasource queue and dead-letter queue, DB Writer Fleet, API Service Fleet, Service Health Management Fleet, Metrics Store, Monitoring Platform, and Service Ops Team Alerting System. The metrics store is self-hosted in this conservative footprint. Managed services above the columns require separate verification of their failure coverage; their placement does not assert automatic multi-domain resilience.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1e293b; text-anchor: middle; }
    .boundary { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; }
    .compute { fill: none; stroke: #8da6be; stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
    .node { fill: #eaf4ff; stroke: #4b8bc4; stroke-width: 2; }
    .band { fill: #eaf4ff; fill-opacity: 0.55; stroke: #b7d6ef; stroke-width: 1; }
    .member { fill: #ffffff; stroke: #4b8bc4; stroke-width: 1.5; }
    .title { font-size: 22px; font-weight: 600; }
    .label { font-size: 18px; font-weight: 600; }
    .detail { font-size: 15px; }
  </style>
