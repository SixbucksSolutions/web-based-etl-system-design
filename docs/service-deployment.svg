  <text class="title" x="645" y="51">DigitalOcean</text>
  <g transform="translate(0, -30)">
  <rect class="band" x="45" y="975" width="905" height="60" rx="5"/>
  <rect class="band" x="45" y="1065" width="905" height="60" rx="5"/>
  <rect class="band" x="45" y="1155" width="905" height="60" rx="5"/>
  <rect class="band" x="45" y="1245" width="905" height="60" rx="5"/>
  <rect class="band" x="45" y="1335" width="905" height="60" rx="5"/>
  <rect class="band" x="45" y="1425" width="905" height="60" rx="5"/>
  <rect class="band" x="45" y="1515" width="905" height="60" rx="5"/>
  <rect class="band" x="45" y="1605" width="905" height="60" rx="5"/>
  <g aria-label="Failure Domain or Availability Zone 1, Compute Instance 1">
    <rect class="boundary" x="345" y="110" width="280" height="1645" rx="8"/>
