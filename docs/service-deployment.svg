<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2150" viewBox="0 0 1290 2150" role="img" aria-labelledby="deployment-title deployment-description">
  <title id="deployment-title">Service deployment across DigitalOcean and a second cloud provider</title>
  <desc id="deployment-description">DigitalOcean contains three illustrative failure-domain columns. The Managed services group shows load balancing, logging, and secrets as shared bars across all three columns; these indicate shared use, not verified physical replica placement. Managed Valkey has a primary in AZ 1 and a standby in AZ 2 as target placement requiring provider confirmation. DigitalOcean documents same-region standbys, not this AZ mapping. Four separate PostgreSQL instances follow: Primary and Read-only Replica 1 in domain 1, Standby Failover and Read-only Replica 2 in domain 2. Each of domains 1 and 2 contains one worker VM. AZ 3 has no application VM or PostgreSQL instance. Eight self-hosted service rows span both worker VMs. Either worker must support essential load alone. Below DigitalOcean, CSP 2, for example AWS, Azure, or Google, contains three illustrative availability zones spanned by a managed message queue and DLQ. Provider examples are alternatives. Provider placement, failover and coordination requirements must be verified separately.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1e293b; text-anchor: middle; }
    .boundary { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; }
    .compute { fill: none; stroke: #8da6be; stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
    .node { fill: #eaf4ff; stroke: #4b8bc4; stroke-width: 2; }
    .band { fill: #eaf4ff; fill-opacity: 0.55; stroke: #b7d6ef; stroke-width: 1; }
    .member { fill: #ffffff; stroke: #4b8bc4; stroke-width: 1.5; }
    .title { font-size: 22px; font-weight: 600; }
    .label { font-size: 18px; font-weight: 600; }
    .detail { font-size: 15px; }
  </style>
  <rect width="1290" height="2150" fill="#ffffff"/>
  <g aria-label="DigitalOcean application deployment">
