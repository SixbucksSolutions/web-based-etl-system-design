    <rect class="member" x="405" y="1255" width="160" height="40" rx="5"/>
    <text class="detail" x="485" y="1280">API instance 1</text>
    <rect class="member" x="715" y="1255" width="160" height="40" rx="5"/>
    <text class="detail" x="795" y="1280">API instance 2</text>
  </g>
  <g aria-label="Service Health Management Fleet, one member per worker VM">
