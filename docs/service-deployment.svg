      <text class="label" x="795" y="528">Valkey Standby</text>
      <text class="detail" x="795" y="556">Failover copy</text>
    </g>
  </g>
  <text class="label" x="180" y="679">Database tier</text>
  <text class="detail" x="180" y="706">Separate single-zone instances</text>
  <text class="detail" x="180" y="730">PostgreSQL + TimescaleDB</text>
  <g aria-label="Primary database in failure domain 1">
