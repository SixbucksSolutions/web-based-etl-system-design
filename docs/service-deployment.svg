    <rect class="member" x="405" y="1165" width="160" height="40" rx="5"/>
    <text class="detail" x="485" y="1190">Writer 1</text>
    <rect class="member" x="715" y="1165" width="160" height="40" rx="5"/>
    <text class="detail" x="795" y="1190">Writer 2</text>
  </g>
  <g aria-label="API Service Fleet , one member per worker VM">
