    <rect class="compute" x="375" y="880" width="220" height="845" rx="7"/>
    <text class="label" x="485" y="914">Compute Instance 1</text>
    <text class="detail" x="485" y="941">Droplet / VM</text>
  </g>
  <g aria-label="Failure Domain or Availability Zone 2, Compute Instance 2">
    <rect class="boundary" x="655" y="110" width="280" height="1645" rx="8"/>
    <text class="label" x="795" y="145">Failure Domain / AZ 2</text>
    <rect class="compute" x="685" y="880" width="220" height="845" rx="7"/>
    <text class="label" x="795" y="914">Compute Instance 2</text>
    <text class="detail" x="795" y="941">Droplet / VM</text>
  </g>
  <g aria-label="Failure Domain or Availability Zone 3, no application VM or PostgreSQL instance">
    <rect class="boundary" x="965" y="110" width="280" height="1645" rx="8"/>
    <text class="label" x="1105" y="145">Failure Domain / AZ 3</text>
  </g>
  <g aria-label="Managed services shared scope and target placement">
