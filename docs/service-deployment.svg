    <text class="label" x="180" y="185">Managed services</text>
    <rect class="node" x="65" y="210" width="860" height="60" rx="6"/>
    <text class="label" x="495" y="235">Regional API Load Balancer</text>
    <text class="detail" x="495" y="257">Routes to healthy application instances</text>
    <rect class="node" x="65" y="300" width="860" height="60" rx="6"/>
    <text class="label" x="495" y="325">Managed OpenSearch</text>
    <text class="detail" x="495" y="347">Regional cluster with at least 3 nodes for node failover</text>
    <rect class="node" x="65" y="390" width="860" height="60" rx="6"/>
    <text class="label" x="495" y="415">Managed Secrets Store</text>
    <text class="detail" x="495" y="437">Regional secret container</text>
    <text class="label" x="180" y="515">Managed Valkey</text>
    <text class="detail" x="180" y="541">One regional cluster</text>
